name: Build Bottle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  bottle:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history is needed so the "Update nightly branch" step
          # can merge main into nightly (a shallow clone has no common
          # ancestor -> "refusing to merge unrelated histories").
          fetch-depth: 0

      # The runner image ships a stale Homebrew, while formula metadata
      # comes fresh from the JSON API. When homebrew-core starts using a
      # feature the bundled brew does not know yet (e.g. the install
      # steps framework), dependency installation fails with errors like
      # "unknown install step: gdk_pixbuf_query_loaders".
      - name: Update Homebrew
        run: brew update

      - name: Tap this repository
        run: brew tap ryankask/emacs-plus

      # Homebrew now refuses to load formulae from third-party taps unless
      # they are explicitly trusted ("Refusing to load formula ... from
      # untrusted tap"). Trust our own tap so install can proceed in CI.
      - name: Trust tap
        run: brew trust ryankask/emacs-plus

      - name: Build emacs-plus@32
        run: |
          export HOMEBREW_DEVELOPER=1
          brew install --build-bottle ryankask/emacs-plus/emacs-plus@32 --verbose

      - name: Test installation
        run: $(brew --prefix)/bin/emacs --batch --eval='(print (+ 2 2))'

      # Emacs bakes its build-time PATH into the binary .pdmp dump file.
      # Under Homebrew's build sandbox that PATH includes the shim directory
      # under /opt/homebrew/Library, and `brew bottle` hard-fails when a keg
      # contains any reference to Homebrew's Library directory (the check
      # cannot be bypassed; --skip-relocation only skips the softer
      # prefix/cellar checks). The dumped value is dead data at runtime —
      # Emacs re-initializes exec-path and process-environment at startup —
      # so rewrite it in place with an equal-length, NUL-padded benign path.
      - name: Scrub build-time PATH from Emacs dump
        run: |
          KEG="$(brew --prefix ryankask/emacs-plus/emacs-plus@32)"
          ruby - "$KEG" <<'RUBY'
            keg = ARGV[0]
            needle = "/opt/homebrew/Library/Homebrew/shims/mac/super"
            replacement = "/opt/homebrew/bin".ljust(needle.length, "\0")
            scrubbed = false
            Dir.glob(File.join(keg, "**", "*.pdmp")).each do |pdmp|
              data = File.binread(pdmp)
              next unless data.include?(needle)
              mode = File.stat(pdmp).mode
              File.chmod(0o644, pdmp)
              # Block form of gsub: NUL bytes in a replacement string would
              # otherwise be interpreted as backreferences.
              File.binwrite(pdmp, data.gsub(needle) { replacement })
              File.chmod(mode, pdmp)
              puts "scrubbed #{pdmp}"
              scrubbed = true
            end
            abort "error: no pdmp contained '#{needle}'" unless scrubbed
          RUBY

      - name: Re-test installation after scrub
        run: $(brew --prefix)/bin/emacs --batch --eval='(print (+ 2 2))'

      # The .pdmp dump file bakes in the build-time PATH, which includes
      # Homebrew's shim dir under /opt/homebrew/Library — unrelocatable by
      # design. Skip relocation: runner and target machines both use
      # /opt/homebrew, so fixed paths are correct. --json gives us the
      # bottle tag and sha256 needed to update the formula's bottle block.
      - name: Create bottle
        run: |
          brew bottle --json --no-rebuild --skip-relocation ryankask/emacs-plus/emacs-plus@32
          echo "BOTTLE_TAG=$(jq -r '.[].bottle.tags | keys[0]' ./emacs-plus@32--*.json)" >> "$GITHUB_ENV"
          echo "BOTTLE_SHA256=$(jq -r '.[].bottle.tags[].sha256' ./emacs-plus@32--*.json)" >> "$GITHUB_ENV"

      # Also upload as a run artifact so a build can be tested from the
      # Actions page without waiting on release mechanics.
      - name: Upload bottle as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bottle
          path: emacs-plus@32--*.bottle*.tar.gz
          if-no-files-found: ignore

      - name: Upload bottle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Homebrew constructs bottle download URLs with a single dash
          # (name-version...), unlike the double-dash local filename
          # produced by `brew bottle`.
          for f in emacs-plus@32--*.bottle*.tar.gz; do
            mv "$f" "${f/--/-}"
          done
          gh release create emacs-plus-32-nightly \
            --repo ${{ github.repository }} \
            --target nightly \
            --title "emacs-plus@32 nightly bottle" \
            --notes "Automated bottle build of emacs-plus@32 (Emacs master)." || true
          # --no-rebuild forces rebuild 0, so the filename is always
          # .bottle.tar.gz (no numeric suffix); --clobber overwrites the
          # single asset each run instead of accumulating versions.
          gh release upload emacs-plus-32-nightly emacs-plus@32-*.bottle*.tar.gz \
            --repo ${{ github.repository }} --clobber

      # The bottle block lives on the `nightly` branch only (the fork's
      # default branch), so the tap serves it and `brew update` picks it
      # up. `main` stays free of bot commits for clean upstream merges.
      # Each run checks out the existing nightly, merges in main to track
      # upstream changes, then updates the sha256 in place and pushes
      # normally (fast-forward). Force-push is avoided because `brew
      # update` rebases the tap and a rewritten history causes conflicts.
      - name: Update nightly branch
        run: |
          # Fetch all branches (checkout only fetches the default branch).
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          # Check out the existing nightly branch (carries the bottle
          # block) and merge main so nightly tracks upstream changes the
          # user has merged into main.
          git checkout --force -B nightly origin/nightly
          git merge --no-edit origin/main

          # Update the sha256 in the existing bottle block (idempotent).
          ruby - Formula/emacs-plus@32.rb <<'RUBY'
            path = ARGV[0]
            tag = ENV.fetch("BOTTLE_TAG")
            sha = ENV.fetch("BOTTLE_SHA256")
            line = %(    sha256 cellar: :any_skip_relocation, #{tag}: "#{sha}")
            src = File.read(path)
            updated = src.sub(/    sha256 cellar: :any_skip_relocation, \w+: "[0-9a-f]{64}"/, line)
            abort "error: bottle sha256 line not found in #{path}" if updated == src
            File.write(path, updated)
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/emacs-plus@32.rb
          git commit -m "chore: update emacs-plus@32 nightly bottle sha256"
          git push origin nightly

      - name: Pack up build logs
        if: always()
        run: |
          LOG_DIR=~/Library/Logs/Homebrew/emacs-plus@32
          if [ -d "$LOG_DIR" ]; then
            tar -C "$LOG_DIR" -czvf emacs-plus@32-build.tar.gz .
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs
          path: emacs-plus@32-build.tar.gz
          if-no-files-found: ignore
